name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: er-aimusicpage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate Version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          VERSION=$(python3 scripts/version_manager.py --release-type "$RELEASE_TYPE" --run-id "$RUN_ID")
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Tag already exists: v${VERSION}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit Stable Version Mirror
        if: inputs.release_type == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > VERSION
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type == 'nightly' }}
          make_latest: ${{ inputs.release_type == 'stable' && 'true' || 'false' }}

      - name: Check Docker Hub Credentials
        id: check_creds
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [[ -n "$DOCKER_USERNAME" ]]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker Tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          HAS_DOCKERHUB: ${{ steps.check_creds.outputs.has_creds }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          TAGS=""
          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            DH_IMAGE="${DOCKER_USERNAME}/er-aimusicpage"
            TAGS="${DH_IMAGE}:${VERSION}"
            if [[ "$RELEASE_TYPE" == "stable" ]]; then
              TAGS="${TAGS},${DH_IMAGE}:latest"
            fi
          fi

          OWNER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          GH_IMAGE="ghcr.io/${OWNER}/er-aimusicpage"
          if [[ -n "$TAGS" ]]; then
            TAGS="${TAGS},"
          fi
          TAGS="${TAGS}${GH_IMAGE}:${VERSION}"
          if [[ "$RELEASE_TYPE" == "stable" ]]; then
            TAGS="${TAGS},${GH_IMAGE}:latest"
          fi
          echo "docker_tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
