name: Rollback Stable Alias

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: Stable CalVer version to restore as latest (with or without v)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: er-aimusicpage-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub Credentials
        id: check_dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.check_dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate stable release and image
        env:
          VERSION_INPUT: ${{ inputs.stable_version }}
          REPOSITORY: ${{ github.repository }}
          HAS_DOCKERHUB: ${{ steps.check_dockerhub.outputs.available }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          VERSION="${VERSION_INPUT#v}"
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "Expected a stable version in YYYY.M.PATCH format." >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null &&
             ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "Stable Git tag does not exist: ${VERSION}" >&2
            exit 1
          fi

          OWNER=$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          GH_IMAGE="ghcr.io/${OWNER}/er-aimusicpage"
          docker buildx imagetools inspect "${GH_IMAGE}:${VERSION}" >/dev/null
          echo "GH_IMAGE=$GH_IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            DH_IMAGE="${DOCKER_USERNAME}/er-aimusicpage"
            docker buildx imagetools inspect "${DH_IMAGE}:${VERSION}" >/dev/null
            echo "DH_IMAGE=$DH_IMAGE" >> "$GITHUB_ENV"
            echo "HAS_DOCKERHUB=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DOCKERHUB=false" >> "$GITHUB_ENV"
          fi

      - name: Restore latest alias
        run: |
          docker buildx imagetools create \
            --tag "${GH_IMAGE}:latest" \
            "${GH_IMAGE}:${VERSION}"
          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            docker buildx imagetools create \
              --tag "${DH_IMAGE}:latest" \
              "${DH_IMAGE}:${VERSION}"
          fi
